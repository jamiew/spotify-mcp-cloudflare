allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true

# GHSA-2v37-7h3g-55p8: nanoid custom generators loop on size 0. Reached only
# through vite -> postcss (a build-time path), and `pnpm update` won't move the
# transitive past postcss's resolved pin. Stay on 3.x: postcss requires it as CJS.
overrides:
  "nanoid@<3.3.18": "^3.3.18"
  # GHSA-fxqj-rqcc-2cmp: same vite -> postcss path; vite resolves it one patch short.
  "postcss@<8.5.23": "^8.5.23"
  "markdown-it@<15.0.3": "^15.0.3"
  "smol-toml@<1.9.0": "^1.9.0"
  # GHSA-gg6h-894w-4m9c, GHSA-238p-pmpm-9mq7: dev-only via markdownlint-cli2.
  "re2js@<2.8.7": "^2.8.7"
  "katex@<0.18.2": "^0.18.2"
  # GHSA-qv5m-9pm6-hqp3, GHSA-jpvv-r467-5p4w: Node-only HTTP adapter pulled in via
  # agents -> @modelcontextprotocol/sdk; the Worker never loads it.
  "@hono/node-server@>=2.0.0 <2.1.6": "^2.1.6"
