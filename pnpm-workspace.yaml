allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true

# GHSA-frvp-7c67-39w9: @hono/node-server path traversal (Windows, serve-static).
# Transitive via @modelcontextprotocol/sdk's Node adapter — never executed on
# Workers. SDK pins <2; drop this ignore when it moves to node-server >=2.0.5.
auditConfig:
  ignoreGhsas:
    - GHSA-frvp-7c67-39w9

# GHSA-2v37-7h3g-55p8: nanoid custom generators loop on size 0. Reached only
# through vite -> postcss (a build-time path), and `pnpm update` won't move the
# transitive past postcss's resolved pin. Stay on 3.x: postcss requires it as CJS.
overrides:
  "nanoid@<3.3.18": "^3.3.18"
  # GHSA-fxqj-rqcc-2cmp: same vite -> postcss path; vite resolves it one patch short.
  "postcss@<8.5.23": "^8.5.23"
